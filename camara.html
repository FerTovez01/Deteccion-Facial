
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
    font-family: Arial, sans-serif;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

#inicio {
    background: #16a34a;
}

#fin {
    background: #dc2626;
}

canvas {
    width: 100%;
    max-width: 800px;
    background: #18202a;
    border-radius: 12px;
}

video {
    display: none;
}
</style>
</head>

<body>

<button id="inicio" onclick="encender()">
    Encender cámara
</button>

<button id="fin" onclick="apagar()">
    Apagar cámara
</button>

<p id="estado">Cámara apagada</p>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
let stream = null;
let detector = null;
let activo = false;

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const estado = document.getElementById("estado");

async function encender() {

    if (activo) return;

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: 640,
                height: 480
            },
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        activo = true;

        estado.textContent = "Cargando detector facial...";

        mostrarVideo();

        const vision = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"
        );

        const archivos = await vision.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        detector = await vision.FaceDetector.createFromOptions(
            archivos,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
                },
                runningMode: "VIDEO",
                minDetectionConfidence: 0.6
            }
        );

        if (activo) {
            estado.textContent = "Detección facial activa";
        }

    } catch (error) {
        estado.textContent = error.name + ": " + error.message;
    }
}

function mostrarVideo() {

    if (!activo) return;

    ctx.drawImage(
        video, 0, 0,
        canvas.width, canvas.height
    );

    if (detector) {

        try {
            const resultado = detector.detectForVideo(
                video,
                performance.now()
            );

            const rostros = resultado.detections;

            for (const rostro of rostros) {

                const caja = rostro.boundingBox;
                const confianza = rostro.categories[0].score;

                const color = confianza >= 0.85
                    ? "#2563eb"
                    : "#ec4899";

                ctx.strokeStyle = color;
                ctx.lineWidth = 3;

                ctx.strokeRect(
                    caja.originX,
                    caja.originY,
                    caja.width,
                    caja.height
                );

                ctx.fillStyle = color;
                ctx.font = "bold 17px Arial";

                ctx.fillText(
                    "Rostro " + (confianza * 100).toFixed(1) + "%",
                    caja.originX,
                    Math.max(20, caja.originY - 8)
                );
            }

            ctx.fillStyle = "#22c55e";
            ctx.font = "bold 20px Arial";

            ctx.fillText(
                "Rostros: " + rostros.length,
                15, 28
            );

        } catch (error) {
            estado.textContent = error.message;
        }
    }

    requestAnimationFrame(mostrarVideo);
}

function apagar() {

    activo = false;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    video.srcObject = null;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    estado.textContent = "Cámara apagada";
}
</script>

</body>
</html>
