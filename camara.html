<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        video {
            width: 100%;
            max-width: 640px;
            background: #18202a;
            border-radius: 10px;
        }
        button {
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button onclick="encender()">Encender cámara</button>
    <button onclick="apagar()">Apagar cámara</button>

    <p id="estado">Cámara apagada</p>

    <video id="video" autoplay playsinline muted></video>

    <script>
        let stream;
        const video = document.getElementById("video");
        const estado = document.getElementById("estado");

        async function encender() {
            try {
                estado.textContent = "Solicitando permisos...";

                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                estado.textContent = "Cámara activa";

            } catch (error) {
                estado.textContent =
                    error.name + ": " + error.message;
            }
        }

        function apagar() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            video.srcObject = null;
            estado.textContent = "Cámara apagada";
        }
    </script>

</body>
</html>
