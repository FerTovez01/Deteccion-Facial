
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
    font-family: Arial, sans-serif;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

#inicio { background: #16a34a; }
#fin { background: #dc2626; }

#contenedor {
    position: relative;
    width: 100%;
    max-width: 800px;
}

video {
    width: 100%;
    border-radius: 12px;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<button id="inicio">Encender cámara</button>
<button id="fin">Apagar cámara</button>

<p id="estado">Cámara apagada</p>

<div id="contenedor">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const estado = document.getElementById("estado");

let stream = null;
let activo = false;
let detector = null;
let procesando = false;

function cargarScript(url) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(
            new Error("No se pudo cargar MediaPipe")
        );
        document.head.appendChild(script);
    });
}

document.getElementById("inicio").onclick = async function() {

    if (activo) return;

    try {

        estado.textContent = "Solicitando permisos...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        activo = true;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        estado.textContent = "Cámara activa. Cargando detector...";

        if (!window.FaceDetection) {

            await cargarScript(
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"
            );
        }

        if (!activo) return;

        detector = new FaceDetection({

            locateFile: (file) => {
                return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/" + file;
            }
        });

        detector.setOptions({
            model: "short",
            minDetectionConfidence: 0.6
        });

        detector.onResults(dibujar);

        estado.textContent = "Detección facial activa";

        procesar();

    } catch (error) {

        estado.textContent =
            error.name + ": " + error.message;
    }
};
function dibujar(resultados) {

    if (!activo) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const rostros = resultados.detections || [];

    for (const rostro of rostros) {

        const caja = rostro.boundingBox;

        if (!caja) continue;

        const w = caja.width * canvas.width;
        const h = caja.height * canvas.height;

        const x = caja.xCenter * canvas.width - w / 2;
        const y = caja.yCenter * canvas.height - h / 2;

        // Obtener confianza de forma segura
        const score =
            rostro.score?.[0] ??
            rostro.categories?.[0]?.score ??
            rostro.classifications?.[0]?.score ??
            null;

        const etiqueta = typeof score === "number"
            ? "Rostro " + (score * 100).toFixed(1) + "%"
            : "Rostro detectado";

        ctx.strokeStyle = "#2563eb";
        ctx.lineWidth = 3;

        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = "#2563eb";
        ctx.font = "bold 18px Arial";

        ctx.fillText(
            etiqueta,
            x,
            Math.max(20, y - 8)
        );
    }

    ctx.fillStyle = "#22c55e";
    ctx.font = "bold 22px Arial";

    ctx.fillText(
        "Rostros: " + rostros.length,
        10,
        30
    );

    estado.textContent = "Detección facial activa";
    
}async function procesar() {

    if (!activo) return;

    if (!procesando && video.readyState >= 2) {

        procesando = true;

        try {

            await detector.send({
                image: video
            });

        } catch (error) {

            estado.textContent =
                "Error del detector: " + error.message;

            return;

        } finally {
            procesando = false;
        }
    }

    requestAnimationFrame(procesar);
}

document.getElementById("fin").onclick = function() {

    activo = false;

    if (stream) {
        stream.getTracks().forEach(t => t.stop());
    }

    video.srcObject = null;

    ctx.clearRect(
        0, 0,
        canvas.width,
        canvas.height
    );

    estado.textContent = "Cámara apagada";
};

</script>
</body>
</html>
